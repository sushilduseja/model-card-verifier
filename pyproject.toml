[project]
name = "model-card-verifier"
version = "0.1.0"
description = "Automated audit pipeline that extracts safety/capability claims from HuggingFace model cards, generates behavioral tests, runs them against a target model, and scores compliance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.83.0",
    "huggingface-hub>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "gradio>=6.15.0",
    "datasets>=2.0.0",
    "pandas>=2.0.0",
]
